name: Mirror to SourceForge

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to SourceForge
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          git config --global user.name "GitHub Actions Mirror"
          git config --global user.email "actions@github.com"

          mkdir -p ~/.ssh
          echo "$SF_KEY" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan git.code.sourceforge.net >> ~/.ssh/known_hosts
          
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          git remote add sourceforge ssh://cryptowalletos@git.code.sourceforge.net/p/moneros/MonerOS.git
          git push sourceforge --all --force
          git push sourceforge --tags --force
